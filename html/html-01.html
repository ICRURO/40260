<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Gráfico SVG</h1>
    <svg width="100" height="100">
        
        <circle r="40" cx="50" cy="50" fill="yellow" stroke="green" stroke-width="4">
            <animate
                attributeName = "cx"
                begin="0s"
                dur="1s"
                from="0"
                to="200"
                repeatCount="indefinite"/>
        </circle>
    </svg>
    <h2>ejemplo con img</h2>
    <image src="gold-ship-uma-musume.gif" alt=""><img/>

    <h2>menú hamburguesa</h2>
    <img src="icono.svg" alt="menú">

    <h2>GIF Animado dentro de SVG</h2>
<svg width="500" height="200" style="border: 1px solid #ccc;">
    <image href="gold-ship-uma-musume.gif" width="100" height="100" y="50">
        <animate
            attributeName="x" 
            begin="0s"
            dur="2s"
            from="150"
            to="30"
            repeatCount="indefinite" />
    </image>
</svg>


    </svg>
